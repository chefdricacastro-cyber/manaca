<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manacá · Fotos do portfólio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --menu: #1F2116;
    --oliva: #282B1C;
    --oliva-claro: #E6E8DC;
    --creme: #F4EBD8;
    --fundo: #F5F5F2;
    --cartao: #FFFFFF;
    --tinta: #1C1E14;
    --suave: #6B6E60;
    --linha: #E4E4DD;
    --perigo: #B4432F;
    --perigo-fundo: #FBECE8;
    --ok: #3E7A3A;
    --raio: 12px;
    --sombra: 0 1px 2px rgba(28,30,20,0.05), 0 4px 16px rgba(28,30,20,0.05);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--fundo); color: var(--tinta);
    font-family: 'Inter', system-ui, sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }
  img{ display:block; }
  svg.ic{ width:18px; height:18px; flex-shrink:0; }
  :focus-visible{ outline:2px solid var(--oliva); outline-offset:2px; }

  /* ---------- BOTÕES ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:38px; padding:0 16px; border-radius:10px; border:1px solid var(--linha);
    background: var(--cartao); color: var(--tinta); font-size:13.5px; font-weight:500;
    text-decoration:none; white-space:nowrap; transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover{ border-color:#cfd0c5; background:#fafaf7; }
  .btn:active{ transform: scale(.98); }
  .btn-principal{ background: var(--oliva); border-color: var(--oliva); color: var(--creme); }
  .btn-principal:hover{ background: var(--menu); border-color: var(--menu); }
  .btn-perigo{ color: var(--perigo); }
  .btn-perigo:hover{ background: var(--perigo-fundo); border-color: #efcfc7; }
  .btn-icone{ width:38px; padding:0; }
  .btn:disabled{ opacity:.5; pointer-events:none; }

  /* ---------- LOGIN ---------- */
  #login-view{
    min-height:100vh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(244,235,216,0.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(181,154,106,0.14), transparent 60%),
      var(--menu);
  }
  .login-card{
    width:100%; max-width:380px; text-align:center;
    background: rgba(244,235,216,0.04); border:1px solid rgba(244,235,216,0.10);
    border-radius:20px; padding:44px 32px 36px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .login-card img{ height:62px; width:auto; margin:0 auto 28px; }
  .login-card h1{ color: var(--creme); font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  .login-card p{ color: rgba(244,235,216,0.6); font-size:13.5px; margin:0 0 28px; }
  .google-btn{
    width:100%; height:46px; display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--creme); color: var(--tinta); border:none; border-radius:12px;
    font-size:14px; font-weight:600; transition: background .15s, transform .1s;
  }
  .google-btn:hover{ background:#fff; }
  .google-btn:active{ transform: scale(.98); }
  .login-error{ color:#E8B4A6; font-size:13px; margin-top:16px; min-height:18px; }

  /* ---------- ESTRUTURA ---------- */
  #admin-view{ display:none; min-height:100vh; }
  .lateral{
    position:fixed; inset:0 auto 0 0; width:264px; background: var(--menu); color: var(--creme);
    display:flex; flex-direction:column; padding: 22px 14px 16px; z-index:20;
  }
  .lateral .logo{ height:38px; width:auto; margin: 4px 10px 26px; }
  .lateral-titulo{
    font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    color: rgba(244,235,216,0.45); padding: 0 10px; margin: 6px 0 8px;
  }
  .nav-lista{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin: 0 -4px; padding: 0 4px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:none; color: rgba(244,235,216,0.78);
    padding: 7px 10px; border-radius:10px; font-size:13.5px; font-weight:500;
    transition: background .15s, color .15s;
  }
  .nav-item:hover{ background: rgba(244,235,216,0.07); color: var(--creme); }
  .nav-item.ativo{ background: rgba(244,235,216,0.13); color: var(--creme); }
  .nav-item .mini{
    width:30px; height:30px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background: rgba(244,235,216,0.10);
  }
  .nav-item .nome{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .num{ font-size:12px; color: rgba(244,235,216,0.45); font-variant-numeric: tabular-nums; }
  .nav-item.ativo .num{ color: rgba(244,235,216,0.75); }
  .nav-item.inicio .mini{ display:flex; align-items:center; justify-content:center; }
  .lateral-rodape{ border-top:1px solid rgba(244,235,216,0.10); padding-top:14px; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .usuario{ display:flex; align-items:center; gap:10px; padding: 4px 6px; }
  .avatar{
    width:32px; height:32px; border-radius:50%; background: var(--creme); color: var(--menu);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
  }
  .usuario .quem{ flex:1; min-width:0; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .usuario button{ background:none; border:none; color: rgba(244,235,216,0.55); font-size:12.5px; padding:6px; border-radius:8px; }
  .usuario button:hover{ color: var(--creme); background: rgba(244,235,216,0.07); }
  .link-site{
    display:flex; align-items:center; gap:10px; padding: 9px 10px; border-radius:10px;
    color: rgba(244,235,216,0.78); text-decoration:none; font-size:13.5px; font-weight:500;
  }
  .link-site:hover{ background: rgba(244,235,216,0.07); color: var(--creme); }

  .principal{ margin-left:264px; min-height:100vh; padding: 28px clamp(18px, 3.5vw, 44px) 120px; }
  .barra-topo{ display:none; }

  /* ---------- CABEÇALHO DA PÁGINA ---------- */
  .pagina-topo{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .pagina-topo h1{ font-size:24px; font-weight:700; letter-spacing:-0.02em; margin:0 0 4px; }
  .pagina-topo .sub{ color: var(--suave); font-size:13.5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .acoes-topo{ display:flex; gap:8px; flex-wrap:wrap; }
  .salvo{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color: var(--suave); }
  .salvo .bolinha{ width:7px; height:7px; border-radius:50%; background: var(--ok); }
  .salvo.salvando .bolinha{ background:#C9A227; animation: pulsar 1s ease-in-out infinite; }
  .salvo.erro{ color: var(--perigo); } .salvo.erro .bolinha{ background: var(--perigo); }
  @keyframes pulsar{ 50%{ opacity:.3; } }

  /* ---------- VISÃO GERAL ---------- */
  .numeros{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-bottom:22px; }
  .numero{ background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding:16px 18px; }
  .numero span{ display:block; font-size:12.5px; color: var(--suave); margin-bottom:4px; }
  .numero strong{ font-size:26px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; }
  .cats-grade{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .cat-cartao{
    background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); overflow:hidden;
    border:none; padding:0; text-align:left; color:inherit; transition: transform .2s, box-shadow .2s;
  }
  .cat-cartao:hover{ transform: translateY(-2px); box-shadow: 0 2px 4px rgba(28,30,20,0.06), 0 12px 28px rgba(28,30,20,0.10); }
  .cat-cartao .capa{ aspect-ratio: 4/3; background: var(--oliva-claro); position:relative; overflow:hidden; }
  .cat-cartao .capa img{ width:100%; height:100%; object-fit:cover; }
  .cat-cartao .capa .sem{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color: var(--suave); font-size:12.5px; }
  .cat-cartao .rodape{ padding:12px 14px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cat-cartao h3{ margin:0; font-size:14.5px; font-weight:600; }
  .pilula{ font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background: var(--oliva-claro); color: var(--oliva); white-space:nowrap; }
  .pilula.vazia{ background:transparent; border:1px dashed #c9cabd; color: var(--suave); }

  /* ---------- ENVIO ---------- */
  .dropzone{
    position:relative; border: 1.5px dashed #cfd0c4; border-radius: var(--raio); background: var(--cartao);
    padding: 26px 20px; display:flex; align-items:center; justify-content:center; gap:16px; text-align:left;
    color: var(--suave); margin-bottom:16px; cursor:pointer; transition: background .15s, border-color .15s;
  }
  .dropzone:hover{ border-color: var(--oliva); }
  .dropzone.arrastando{ background: var(--oliva-claro); border-color: var(--oliva); }
  .dropzone .ic-grande{ width:44px; height:44px; border-radius:12px; background: var(--oliva-claro); color: var(--oliva); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dropzone strong{ color: var(--tinta); display:block; font-size:14.5px; }
  .dropzone input{ display:none; }

  .fila{ background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding:14px 16px; margin-bottom:16px; display:none; }
  .fila.on{ display:block; }
  .fila-topo{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:10px; }
  .fila-topo span{ color: var(--suave); font-weight:500; }
  .barra{ height:6px; background: var(--fundo); border-radius:999px; overflow:hidden; margin-bottom:12px; }
  .barra i{ display:block; height:100%; width:0; background: var(--oliva); border-radius:999px; transition: width .2s; }
  .fila-itens{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .fila-item{ position:relative; width:54px; height:54px; border-radius:8px; overflow:hidden; flex-shrink:0; background: var(--fundo); }
  .fila-item img{ width:100%; height:100%; object-fit:cover; opacity:.45; transition: opacity .2s; }
  .fila-item.pronto img{ opacity:1; }
  .fila-item .prog{ position:absolute; left:0; bottom:0; height:3px; background: var(--oliva); width:0; transition: width .2s; }
  .fila-item.pronto .prog{ display:none; }
  .fila-item.erro{ outline:2px solid var(--perigo); outline-offset:-2px; }
  .fila-item .marca{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:#fff; background: rgba(62,122,58,0.55); }
  .fila-item.pronto .marca{ display:flex; animation: some .8s 1s forwards; }
  @keyframes some{ to{ opacity:0; } }

  /* ---------- BARRA DE FERRAMENTAS DA GRADE ---------- */
  .ferramentas{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .dica{ color: var(--suave); font-size:13px; display:flex; align-items:center; gap:7px; }

  /* ---------- GRADE DE FOTOS ---------- */
  .fotos-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .foto{
    position:relative; border-radius: var(--raio); overflow:hidden; aspect-ratio: 4/5;
    background: var(--oliva-claro); box-shadow: var(--sombra); cursor:grab; user-select:none; -webkit-user-select:none;
    transition: box-shadow .2s, transform .2s;
  }
  .foto img{ width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0; transition: opacity .4s; }
  .foto img.ok{ opacity:1; }
  .foto:hover{ box-shadow: 0 4px 22px rgba(28,30,20,0.16); }
  .sortable-ghost{ opacity:.25; }
  .sortable-chosen{ transform: scale(1.03); box-shadow: 0 14px 40px rgba(28,30,20,0.28) !important; }
  .foto .ordem{
    position:absolute; top:8px; left:8px; min-width:24px; height:24px; padding:0 7px; border-radius:999px;
    background: rgba(28,30,20,0.62); color:#fff; font-size:11.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .foto .capa-tag{
    position:absolute; top:8px; left:8px; height:24px; padding:0 9px 0 7px; border-radius:999px;
    background: var(--creme); color: var(--menu); font-size:11.5px; font-weight:700;
    display:flex; align-items:center; gap:4px;
  }
  .foto .capa-tag svg{ width:13px; height:13px; }
  .foto .acoes{
    position:absolute; left:0; right:0; bottom:0; padding:28px 8px 8px; display:flex; justify-content:flex-end; gap:6px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.55));
    opacity:0; transition: opacity .15s;
  }
  .foto:hover .acoes, .foto:focus-within .acoes{ opacity:1; }
  .acao{
    width:34px; height:34px; border-radius:10px; border:none; background: rgba(255,255,255,0.94); color: var(--tinta);
    display:flex; align-items:center; justify-content:center; transition: background .15s, transform .1s;
  }
  .acao:hover{ background:#fff; transform: translateY(-1px); }
  .acao.excluir{ color: var(--perigo); }
  .acao svg{ width:16px; height:16px; }
  .acao.ligado{ background: var(--creme); }

  /* Seleção */
  .foto .check{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    border:2px solid #fff; background: rgba(0,0,0,0.25); display:none; align-items:center; justify-content:center; color:#fff;
  }
  .selecionando .foto{ cursor:pointer; }
  .selecionando .foto .check{ display:flex; }
  .selecionando .foto .acoes{ display:none; }
  .foto.marcada{ outline:3px solid var(--oliva); outline-offset:-3px; }
  .foto.marcada .check{ background: var(--oliva); border-color: var(--oliva); }
  .foto.marcada img{ transform: scale(.94); border-radius:8px; }
  .foto .check svg{ width:14px; height:14px; display:none; }
  .foto.marcada .check svg{ display:block; }

  .vazio{
    background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra);
    padding: 50px 20px; text-align:center; color: var(--suave);
  }
  .vazio strong{ display:block; color: var(--tinta); font-size:15px; margin-bottom:4px; }

  /* Barra de ações em lote */
  .lote{
    position:fixed; z-index:30; left:50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 140%); transition: transform .3s cubic-bezier(.22,.61,.36,1);
    background: var(--menu); color: var(--creme); border-radius:14px; padding:8px 8px 8px 16px;
    display:flex; align-items:center; gap:10px; box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    margin-left:132px;
  }
  .lote.on{ transform: translate(-50%, 0); }
  .lote .qtd{ font-weight:600; font-size:13.5px; white-space:nowrap; margin-right:4px; }
  .lote .btn{ height:36px; background: rgba(244,235,216,0.10); border-color: transparent; color: var(--creme); }
  .lote .btn:hover{ background: rgba(244,235,216,0.18); }
  .lote .btn-perigo{ color:#F0B6A8; }

  /* ---------- AVISOS (toast) ---------- */
  .avisos{ position:fixed; z-index:60; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .aviso{
    background: var(--tinta); color:#fff; border-radius:12px; padding:11px 12px 11px 16px; font-size:13.5px;
    display:flex; align-items:center; gap:14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    animation: entra .25s ease;
  }
  .aviso.erro{ background: var(--perigo); }
  .aviso button{ background: rgba(255,255,255,0.14); color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; }
  .aviso button:hover{ background: rgba(255,255,255,0.24); }
  @keyframes entra{ from{ opacity:0; transform: translateY(8px); } }

  /* ---------- JANELAS ---------- */
  .janela-fundo{
    position:fixed; inset:0; z-index:50; background: rgba(20,21,14,0.55); display:none; align-items:center; justify-content:center; padding:20px;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .janela-fundo.on{ display:flex; }
  .janela{ background: var(--cartao); border-radius:16px; width:100%; max-width:420px; padding:22px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
  .janela h2{ margin:0 0 4px; font-size:17px; }
  .janela p{ margin:0 0 16px; color: var(--suave); font-size:13.5px; }
  .opcoes{ display:flex; flex-direction:column; gap:6px; max-height: 50vh; overflow-y:auto; margin-bottom:16px; }
  .opcao{ display:flex; align-items:center; gap:12px; padding:8px; border-radius:10px; border:1px solid var(--linha); background:#fff; text-align:left; font-size:14px; font-weight:500; }
  .opcao:hover{ border-color: var(--oliva); background: #fafaf7; }
  .opcao img, .opcao .mini{ width:36px; height:36px; border-radius:8px; object-fit:cover; background: var(--oliva-claro); flex-shrink:0; }
  .opcao span{ margin-left:auto; color: var(--suave); font-size:12.5px; font-weight:400; }
  .janela-botoes{ display:flex; justify-content:flex-end; gap:8px; }

  #ver-foto{ background: rgba(14,15,10,0.94); }
  #ver-foto img{ max-width: 92vw; max-height: 86vh; border-radius:8px; }
  #ver-foto .fechar{ position:absolute; top:16px; right:16px; }

  /* ---------- CELULAR ---------- */
  @media (max-width: 900px){
    .lateral{ display:none; }
    .principal{ margin-left:0; padding: 0 0 120px; }
    .barra-topo{
      display:block; position:sticky; top:0; z-index:20; background: var(--menu); color: var(--creme);
      padding: calc(10px + env(safe-area-inset-top)) 0 10px;
    }
    .barra-topo .linha1{ display:flex; align-items:center; justify-content:space-between; padding: 0 16px 10px; }
    .barra-topo .logo{ height:28px; width:auto; }
    .barra-topo .linha1 .avatar{ width:30px; height:30px; }
    .chips{ display:flex; gap:6px; overflow-x:auto; padding: 0 16px; scrollbar-width:none; }
    .chips::-webkit-scrollbar{ display:none; }
    .chip{
      flex-shrink:0; height:32px; padding: 0 12px; border-radius:999px; border:1px solid rgba(244,235,216,0.18);
      background:transparent; color: rgba(244,235,216,0.8); font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
    }
    .chip.ativo{ background: var(--creme); color: var(--menu); border-color: var(--creme); }
    .chip small{ opacity:.6; }
    .conteudo{ padding: 20px 14px 0; }
    .numeros{ grid-template-columns: repeat(3, 1fr); gap:8px; }
    .numero{ padding:12px; } .numero strong{ font-size:21px; } .numero span{ font-size:11.5px; }
    .cats-grade{ grid-template-columns: repeat(2, 1fr); gap:10px; }
    .fotos-grid{ grid-template-columns: repeat(3, 1fr); gap:6px; }
    .foto{ border-radius:8px; }
    .foto .acoes{ display:none; }
    .dropzone{ padding: 18px 16px; justify-content:flex-start; }
    .lote{ margin-left:0; left:12px; right:12px; transform: translateY(140%); }
    .lote.on{ transform:none; }
    .lote{ justify-content:space-between; }
    .avisos{ left:12px; right:12px; bottom: calc(84px + env(safe-area-inset-bottom)); align-items:stretch; }
    .acoes-topo .texto-opcional{ display:none; }
    .acoes-topo .btn{ padding:0 12px; }
  }
  /* ---------- FOTOS DE CAPA ---------- */
  .capas-secao{ margin: 26px 0 12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .capas-secao h2{ font-size:16px; margin:0; }
  .capas-secao span{ color: var(--suave); font-size:13px; }
  .capas-grade{ display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .capa-slot{ background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); overflow:hidden; display:flex; flex-direction:column; }
  .capa-slot .previa{ aspect-ratio: 16/9; background: var(--oliva-claro); position:relative; overflow:hidden; }
  .capa-slot .previa img{ width:100%; height:100%; object-fit:cover; }
  .capa-slot .previa .sem{ position:absolute; inset:0; display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; color: var(--suave); font-size:12.5px; text-align:center; padding:0 16px; }
  .capa-slot .previa .herdada{ position:absolute; left:8px; bottom:8px; background: rgba(28,30,20,0.7); color:#fff; font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .capa-slot .previa.herda img{ opacity:.45; filter: grayscale(.4); }
  .capa-slot .info{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .capa-slot h3{ margin:0; font-size:14px; }
  .capa-slot p{ margin:2px 0 0; color: var(--suave); font-size:12.5px; line-height:1.4; }
  .capa-slot .botoes{ display:flex; gap:6px; margin-top:auto; }
  .capa-slot .botoes .btn{ height:34px; padding:0 12px; font-size:13px; flex:1; }
  .capa-slot .botoes .btn-icone{ flex:0 0 34px; width:34px; padding:0; }
  .capa-slot.enviando .previa::after{ content:'Enviando…'; position:absolute; inset:0; background: rgba(255,255,255,.75); display:flex; align-items:center; justify-content:center; font-weight:600; }
  .janela.larga{ max-width: 860px; }
  .escolher-filtros{ display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .escolher-filtros button{ flex-shrink:0; height:30px; padding:0 12px; border-radius:999px; border:1px solid var(--linha); background:#fff; font-size:12.5px; font-weight:500; }
  .escolher-filtros button.ativo{ background: var(--oliva); color: var(--creme); border-color: var(--oliva); }
  .escolher-grade{ display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; max-height: 56vh; overflow-y:auto; margin-bottom:16px; }
  .escolher-grade button{ border:none; padding:0; border-radius:8px; overflow:hidden; aspect-ratio: 1; background: var(--oliva-claro); transition: transform .15s, box-shadow .15s; }
  .escolher-grade button:hover{ transform: scale(1.03); box-shadow: 0 0 0 3px var(--oliva); }
  .escolher-grade img{ width:100%; height:100%; object-fit:cover; }
  .nav-separador{ height:1px; background: rgba(244,235,216,0.10); margin: 10px 6px; }

  @media (min-width: 901px){ .conteudo{ max-width:1180px; } }
  @media (hover: none){
    .foto .acoes{ opacity:1; }
  }
</style>
</head>

    <img id="ver-foto-img" src="" alt="">
  </div>

  <div class="avisos" id="avisos"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- Cloudinary (onde as fotos ficam guardadas) ----
  const CLOUDINARY_CLOUD_NAME = 'nhdgiswb';
  const CLOUDINARY_UPLOAD_PRESET = 'manaca-fotos';
  const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

  // ---- Config do projeto manaca-buffet (mesmo do sistema de orçamentos) ----
  const firebaseConfig = {
    apiKey: "AIzaSyBgfScWXpS7MVX0YjffkNckKgPrfOvBM4I",
    authDomain: "manaca-buffet-29d1f.firebaseapp.com",
    projectId: "manaca-buffet-29d1f",
    storageBucket: "manaca-buffet-29d1f.firebasestorage.app",
    messagingSenderId: "901332399199",
    appId: "1:901332399199:web:3bc9e1bb1128218cd317ea"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---- Categorias (mesma lista do portfólio do cliente) ----
  const categorias = [
    { id:'casamento',     nome:'Casamentos' },
    { id:'aniversario',   nome:'Aniversários' },
    { id:'festainfantil', nome:'Festa Infantil' },
    { id:'coquetel',      nome:'Coquetel' },
    { id:'jantar',        nome:'Jantar / Almoço' },
    { id:'coffeebrunch',  nome:'Coffee Break / Brunch' },
    { id:'feijoada',      nome:'Feijoada' },
    { id:'churrasco',     nome:'Churrasco' },
    { id:'mesadefrios',   nome:'Mesa de Frios' },
    { id:'corporativo',   nome:'Treinamento Corporativo' },
  ];

  const fotosPorCategoria = {};   // { categoriaId: [{url, path, capa}, ...] }
  let categoriaAtual = null;      // null = visão geral
  let selecionando = false;
  const selecionadas = new Set(); // guarda o "path" (ou url) das fotos marcadas
  let sortable = null;

  // ---- Ajudantes ----
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const chave = f => f.path || f.url;
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  function opt(url, largura){
    if(!url || !url.includes('res.cloudinary.com') || !url.includes('/image/upload/')) return url;
    return url.replace('/image/upload/', `/image/upload/f_auto,q_auto,c_fill,g_auto,w_${largura},h_${Math.round(largura*1.25)}/`);
  }
  function optInteira(url, largura){
    if(!url || !url.includes('res.cloudinary.com') || !url.includes('/image/upload/')) return url;
    return url.replace('/image/upload/', `/image/upload/f_auto,q_auto,c_limit,w_${largura}/`);
  }
  const nomeCat = id => (categorias.find(c => c.id === id) || {}).nome || id;
  const capaDe = lista => lista.find(f => f.capa) || lista[0];

  const IC = {
    estrela: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    estrelaVazia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    lixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    ampliar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
    mover: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>',
    foto: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
    subir: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
    grade: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
    link: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    externo: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    selecionar: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/></svg>',
    estrelaVaziaNav: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    arrastar: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>',
  };

  // ---- Avisos ----
  function aviso(texto, opcoes = {}){
    const el = document.createElement('div');
    el.className = 'aviso' + (opcoes.erro ? ' erro' : '');
    el.innerHTML = `<span>${esc(texto)}</span>`;
    if(opcoes.desfazer){
      const b = document.createElement('button');
      b.textContent = 'Desfazer';
      b.onclick = () => { opcoes.desfazer(); el.remove(); };
      el.appendChild(b);
    }
    $('avisos').appendChild(el);
    setTimeout(() => el.remove(), opcoes.desfazer ? 7000 : 3200);
  }

  // ---- Indicador "salvo" ----
  let salvandoCont = 0;
  function estadoSalvo(estado){
    const el = $('estado-salvo');
    if(!el) return;
    el.className = 'salvo' + (estado === 'salvando' ? ' salvando' : estado === 'erro' ? ' erro' : '');
    el.innerHTML = `<span class="bolinha"></span>${estado === 'salvando' ? 'Salvando…' : estado === 'erro' ? 'Não salvou — tente de novo' : 'Tudo salvo'}`;
  }

  // ---- Abre direto, sem login (pedido de 23/10/2026) ----
  // Quem tiver o link consegue mexer nas fotos: não divulgar o endereço deste admin.
  (async () => {
    $('conteudo').innerHTML = '<div class="vazio">Carregando as fotos…</div>';
    await carregarTodas();
    try{ await carregarCapas(); }catch(e){}
    rota();
  })();

  // ---- Firestore ----
  async function carregarFotos(id){
    const snap = await getDoc(doc(db, 'portfolio_fotos', id));
    fotosPorCategoria[id] = snap.exists() ? (snap.data().fotos || []) : [];
    return fotosPorCategoria[id];
  }
  async function carregarTodas(){
    await Promise.all(categorias.map(c => carregarFotos(c.id).catch(err => { console.error(err); fotosPorCategoria[c.id] = []; })));
  }
  async function salvarFotos(id){
    salvandoCont++; estadoSalvo('salvando');
    try{
      await setDoc(doc(db, 'portfolio_fotos', id), { fotos: fotosPorCategoria[id] });
      salvandoCont--; if(!salvandoCont) estadoSalvo('ok');
      renderNav();
    }catch(err){
      salvandoCont--;
      console.error(err);
      estadoSalvo('erro');
      aviso('Não consegui salvar. Confira a internet e tente de novo.', { erro:true });
    }
  }

  // ---- Navegação (#casamento abre direto a categoria) ----
  window.abrir = id => { location.hash = id || ''; };
  window.addEventListener('hashchange', rota);
  async function rota(){
    const id = location.hash.replace('#', '');
    sairSelecao(true);
    if(id === 'capas'){
      categoriaAtual = 'capas';
      renderNav();
      renderCapas();
      try{ await carregarCapas(); if(categoriaAtual === 'capas') renderCapas(); }catch(e){}
    }else if(id && categorias.some(c => c.id === id)){
      categoriaAtual = id;
      renderNav();
      renderCategoria();
      // Busca de novo no servidor, para não sobrescrever o que outra pessoa acabou de fazer
      try{ await carregarFotos(id); if(categoriaAtual === id) renderFotos(); }catch(e){}
    }else{
      categoriaAtual = null;
      renderNav();
      renderVisaoGeral();
    }
    window.scrollTo(0, 0);
  }

  // ---- Menu lateral e chips do celular ----
  function renderNav(){
    const total = categorias.reduce((s, c) => s + (fotosPorCategoria[c.id]?.length || 0), 0);
    $('nav-lista').innerHTML =
      `<button class="nav-item inicio ${categoriaAtual ? '' : 'ativo'}" onclick="abrir('')">
         <span class="mini">${IC.grade}</span><span class="nome">Visão geral</span><span class="num">${total}</span>
       </button>` +
      categorias.map(c => {
        const lista = fotosPorCategoria[c.id] || [];
        const capa = capaDe(lista);
        return `<button class="nav-item ${categoriaAtual === c.id ? 'ativo' : ''}" onclick="abrir('${c.id}')">
          ${capa ? `<img class="mini" src="${esc(opt(capa.url, 80))}" alt="">` : '<span class="mini"></span>'}
          <span class="nome">${esc(c.nome)}</span><span class="num">${lista.length}</span>
        </button>`;
      }).join('') +
      `<div class="nav-separador"></div>
       <button class="nav-item inicio ${categoriaAtual === 'capas' ? 'ativo' : ''}" onclick="abrir('capas')">
         <span class="mini">${IC.estrelaVaziaNav}</span><span class="nome">Fotos de capa</span><span class="num">${contarCapas()}</span>
       </button>`;
    $('chips').innerHTML =
      `<button class="chip ${categoriaAtual ? '' : 'ativo'}" onclick="abrir('')">Visão geral</button>` +
      `<button class="chip ${categoriaAtual === 'capas' ? 'ativo' : ''}" onclick="abrir('capas')">Fotos de capa</button>` +
      categorias.map(c => `<button class="chip ${categoriaAtual === c.id ? 'ativo' : ''}" onclick="abrir('${c.id}')">${esc(c.nome)} <small>${(fotosPorCategoria[c.id] || []).length}</small></button>`).join('');
    const ativo = $('chips').querySelector('.ativo');
    if(ativo) ativo.scrollIntoView({ inline:'center', block:'nearest' });
  }

  // ---- Visão geral ----
  function renderVisaoGeral(){
    const total = categorias.reduce((s, c) => s + fotosPorCategoria[c.id].length, 0);
    const comFotos = categorias.filter(c => fotosPorCategoria[c.id].length).length;
    const vazias = categorias.length - comFotos;
    $('conteudo').innerHTML = `
      <div class="pagina-topo">
        <div>
          <h1>Fotos do portfólio</h1>
          <div class="sub">Escolha uma categoria para subir ou organizar as fotos. Categorias sem foto não aparecem para o cliente.</div>
        </div>
        <div class="acoes-topo">
          <a class="btn" href="manaca-portfolio.html" target="_blank" rel="noopener">${IC.externo}<span class="texto-opcional">Ver o site do cliente</span></a>
        </div>
      </div>
      <div class="numeros">
        <div class="numero"><span>Fotos publicadas</span><strong>${total}</strong></div>
        <div class="numero"><span>Categorias no ar</span><strong>${comFotos}</strong></div>
        <div class="numero"><span>Sem fotos ainda</span><strong>${vazias}</strong></div>
      </div>
      <div class="cats-grade">
        ${categorias.map(c => {
          const lista = fotosPorCategoria[c.id];
          const capa = capaDe(lista);
          return `<button class="cat-cartao" onclick="abrir('${c.id}')">
            <div class="capa">${capa ? `<img src="${esc(opt(capa.url, 440))}" alt="" loading="lazy">` : `<div class="sem">${IC.foto}Sem fotos</div>`}</div>
            <div class="rodape"><h3>${esc(c.nome)}</h3><span class="pilula ${lista.length ? '' : 'vazia'}">${lista.length ? plural(lista.length, 'foto', 'fotos') : 'Fora do site'}</span></div>
          </button>`;
        }).join('')}
      </div>`;
  }

  // ---- Página da categoria ----
  function renderCategoria(){
    const id = categoriaAtual;
    const linkCliente = new URL('manaca-portfolio.html#' + id, location.href).href;
    $('conteudo').innerHTML = `
      <div class="pagina-topo">
        <div>
          <h1>${esc(nomeCat(id))}</h1>
          <div class="sub"><span id="detail-contagem"></span><span id="estado-salvo" class="salvo"><span class="bolinha"></span>Tudo salvo</span></div>
        </div>
        <div class="acoes-topo">
          <button class="btn" id="btn-selecionar" onclick="alternarSelecao()">${IC.selecionar}<span class="texto-opcional">Selecionar</span></button>
          <button class="btn" onclick="copiarLink('${linkCliente}')" title="Copiar o link desta categoria para mandar ao cliente">${IC.link}<span class="texto-opcional">Copiar link</span></button>
          <a class="btn" href="${esc(linkCliente)}" target="_blank" rel="noopener" title="Ver como o cliente vê">${IC.externo}<span class="texto-opcional">Ver no site</span></a>
        </div>
      </div>

      <label class="dropzone" id="dropzone">
        <span class="ic-grande">${IC.subir}</span>
        <span><strong>Adicionar fotos</strong>Clique para escolher ou arraste para cá. Pode mandar várias de uma vez.</span>
        <input type="file" id="file-input" multiple accept="image/*">
      </label>

      <div class="fila" id="fila">
        <div class="fila-topo">Enviando fotos <span id="fila-texto"></span></div>
        <div class="barra"><i id="fila-barra"></i></div>
        <div class="fila-itens" id="fila-itens"></div>
      </div>

      <div class="ferramentas" id="ferramentas">
        <div class="dica">${IC.arrastar}<span id="dica-texto">Arraste as fotos para mudar a ordem. A primeira com estrela é a capa.</span></div>
      </div>
      <div class="fotos-grid" id="fotos-grid"></div>
      <div class="vazio" id="empty-state" style="display:none"><strong>Nenhuma foto ainda</strong>Esta categoria não aparece para o cliente até ter pelo menos uma foto.</div>`;

    ligarEnvio();
    renderFotos();
  }

  function renderFotos(){
    const grid = $('fotos-grid');
    if(!grid) return;
    const fotos = fotosPorCategoria[categoriaAtual];
    $('detail-contagem').textContent = plural(fotos.length, 'foto', 'fotos');
    $('empty-state').style.display = fotos.length ? 'none' : 'block';
    $('ferramentas').style.display = fotos.length > 1 ? 'flex' : 'none';
    grid.classList.toggle('selecionando', selecionando);
    $('dica-texto').textContent = selecionando
      ? 'Toque nas fotos para marcar. Depois escolha mover ou excluir.'
      : (window.matchMedia('(hover: none)').matches
          ? 'Segure e arraste uma foto para mudar a ordem. Toque numa foto para ver as opções.'
          : 'Arraste as fotos para mudar a ordem em que aparecem para o cliente.');

    grid.innerHTML = fotos.map((f, i) => `
      <div class="foto ${selecionadas.has(chave(f)) ? 'marcada' : ''}" data-chave="${esc(chave(f))}" tabindex="0">
        <img src="${esc(opt(f.url, 360))}" alt="" loading="lazy" onload="this.classList.add('ok')">
        ${f.capa ? `<div class="capa-tag">${IC.estrela}Capa</div>` : `<div class="ordem">${i + 1}</div>`}
        <div class="check">${IC.check}</div>
        <div class="acoes">
          <button class="acao ${f.capa ? 'ligado' : ''}" data-acao="capa" title="${f.capa ? 'Esta é a capa' : 'Usar como capa'}">${f.capa ? IC.estrela : IC.estrelaVazia}</button>
          <button class="acao" data-acao="ver" title="Ver grande">${IC.ampliar}</button>
          <button class="acao" data-acao="mover" title="Mover para outra categoria">${IC.mover}</button>
          <button class="acao excluir" data-acao="excluir" title="Excluir">${IC.lixo}</button>
        </div>
      </div>`).join('');

    if(sortable) sortable.destroy();
    sortable = Sortable.create(grid, {
      animation: 180,
      delay: 220, delayOnTouchOnly: true,     // no celular: segurar um pouquinho antes de arrastar
      disabled: selecionando,
      ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen',
      filter: '.acao', preventOnFilter: false,
      onEnd: async ev => {
        if(ev.oldIndex === ev.newIndex) return;
        const lista = fotosPorCategoria[categoriaAtual];
        const [movida] = lista.splice(ev.oldIndex, 1);
        lista.splice(ev.newIndex, 0, movida);
        renderFotos();
        await salvarFotos(categoriaAtual);
      }
    });
  }

  // Cliques dentro da grade (um só "ouvinte" para todas as fotos)
  document.addEventListener('click', e => {
    const foto = e.target.closest('#fotos-grid .foto');
    if(!foto) return;
    const lista = fotosPorCategoria[categoriaAtual];
    const i = lista.findIndex(f => chave(f) === foto.dataset.chave);
    if(i < 0) return;

    if(selecionando){
      const k = foto.dataset.chave;
      selecionadas.has(k) ? selecionadas.delete(k) : selecionadas.add(k);
      foto.classList.toggle('marcada', selecionadas.has(k));
      atualizarLote();
      return;
    }
    const acao = e.target.closest('.acao')?.dataset.acao;
    if(acao === 'capa') definirCapa(i);
    else if(acao === 'ver') verFoto(i);
    else if(acao === 'mover'){ selecionadas.clear(); selecionadas.add(chave(lista[i])); abrirMover(); }
    else if(acao === 'excluir') excluir([chave(lista[i])]);
    else if(!acao && window.matchMedia('(hover: none)').matches) menuCelular(i);
    else if(!acao) verFoto(i);
  });

  // No celular, tocar numa foto abre um menu simples
  function menuCelular(i){
    const lista = fotosPorCategoria[categoriaAtual];
    const f = lista[i];
    $('mover-opcoes').innerHTML = `
      <button class="opcao" data-m="ver"><span class="mini" style="display:flex;align-items:center;justify-content:center">${IC.ampliar}</span>Ver grande</button>
      ${f.capa ? '' : `<button class="opcao" data-m="capa"><span class="mini" style="display:flex;align-items:center;justify-content:center">${IC.estrelaVazia}</span>Usar como capa</button>`}
      <button class="opcao" data-m="mover"><span class="mini" style="display:flex;align-items:center;justify-content:center">${IC.mover}</span>Mover para outra categoria</button>
      <button class="opcao" data-m="excluir" style="color:var(--perigo)"><span class="mini" style="display:flex;align-items:center;justify-content:center">${IC.lixo}</span>Excluir</button>`;
    document.querySelector('#janela-mover h2').textContent = 'Foto ' + (i + 1);
    $('mover-texto').innerHTML = `<img src="${esc(opt(f.url, 400))}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px">`;
    $('mover-opcoes').onclick = e => {
      const m = e.target.closest('[data-m]')?.dataset.m;
      if(!m) return;
      fecharMover();
      if(m === 'ver') verFoto(i);
      if(m === 'capa') definirCapa(i);
      if(m === 'mover'){ selecionadas.clear(); selecionadas.add(chave(f)); abrirMover(); }
      if(m === 'excluir') excluir([chave(f)]);
    };
    $('janela-mover').classList.add('on');
  }

  // ---- Capa ----
  async function definirCapa(i){
    const lista = fotosPorCategoria[categoriaAtual];
    lista.forEach(f => f.capa = false);
    lista[i].capa = true;
    renderFotos();
    await salvarFotos(categoriaAtual);
    aviso('Capa da categoria trocada');
  }

  // ---- Excluir (com "Desfazer") ----
  async function excluir(chaves){
    const id = categoriaAtual;
    const antes = fotosPorCategoria[id].slice();
    fotosPorCategoria[id] = antes.filter(f => !chaves.includes(chave(f)));
    if(!fotosPorCategoria[id].some(f => f.capa) && fotosPorCategoria[id][0]) fotosPorCategoria[id][0].capa = true;
    sairSelecao(true);
    renderFotos();
    await salvarFotos(id);
    aviso(chaves.length === 1 ? 'Foto excluída' : `${chaves.length} fotos excluídas`, {
      desfazer: async () => {
        fotosPorCategoria[id] = antes;
        if(categoriaAtual === id) renderFotos();
        await salvarFotos(id);
        aviso('Pronto, voltou');
      }
    });
    // Obs.: a foto sai do portfólio, mas o arquivo continua guardado no Cloudinary
    // (apagar de lá exige uma chave secreta que não pode ficar no navegador).
  }
  window.excluirSelecionadas = () => { if(selecionadas.size) excluir([...selecionadas]); };

  // ---- Mover para outra categoria ----
  window.abrirMover = function(){
    if(!selecionadas.size) return;
    document.querySelector('#janela-mover h2').textContent = 'Mover para outra categoria';
    $('mover-texto').textContent = `${plural(selecionadas.size, 'foto vai', 'fotos vão')} para o fim da categoria escolhida.`;
    $('mover-opcoes').innerHTML = categorias.filter(c => c.id !== categoriaAtual).map(c => {
      const lista = fotosPorCategoria[c.id] || [];
      const capa = capaDe(lista);
      return `<button class="opcao" data-destino="${c.id}">
        ${capa ? `<img src="${esc(opt(capa.url, 80))}" alt="">` : '<span class="mini"></span>'}
        ${esc(c.nome)}<span>${lista.length}</span></button>`;
    }).join('');
    $('mover-opcoes').onclick = e => {
      const destino = e.target.closest('[data-destino]')?.dataset.destino;
      if(destino) moverPara(destino);
    };
    $('janela-mover').classList.add('on');
  };
  window.fecharMover = () => $('janela-mover').classList.remove('on');

  async function moverPara(destino){
    fecharMover();
    const origem = categoriaAtual;
    const chaves = [...selecionadas];
    await carregarFotos(destino).catch(() => {});
    const movidas = fotosPorCategoria[origem].filter(f => chaves.includes(chave(f)));
    const destinoTemCapa = fotosPorCategoria[destino].some(f => f.capa);
    movidas.forEach((f, k) => { f.capa = !destinoTemCapa && k === 0; });
    fotosPorCategoria[destino].push(...movidas);
    fotosPorCategoria[origem] = fotosPorCategoria[origem].filter(f => !chaves.includes(chave(f)));
    if(!fotosPorCategoria[origem].some(f => f.capa) && fotosPorCategoria[origem][0]) fotosPorCategoria[origem][0].capa = true;
    sairSelecao(true);
    renderFotos();
    await Promise.all([salvarFotos(destino), salvarFotos(origem)]);
    aviso(`${plural(movidas.length, 'foto movida', 'fotos movidas')} para ${nomeCat(destino)}`);
  }

  // ---- Seleção de várias fotos ----
  window.alternarSelecao = () => selecionando ? sairSelecao() : entrarSelecao();
  function entrarSelecao(){
    selecionando = true; selecionadas.clear();
    $('btn-selecionar')?.classList.add('btn-principal');
    renderFotos(); atualizarLote();
  }
  window.sairSelecao = function(silencioso){
    selecionando = false; selecionadas.clear();
    $('btn-selecionar')?.classList.remove('btn-principal');
    $('lote').classList.remove('on');
    if(silencioso !== true) renderFotos();
  };
  function atualizarLote(){
    $('lote-qtd').textContent = selecionadas.size ? plural(selecionadas.size, 'selecionada', 'selecionadas') : 'Toque nas fotos';
    $('lote').classList.toggle('on', selecionando);
    $('lote').querySelectorAll('.btn:not(.btn-icone)').forEach(b => b.disabled = !selecionadas.size);
  }

  // ---- Ver foto grande ----
  function verFoto(i){
    const f = fotosPorCategoria[categoriaAtual][i];
    $('ver-foto-img').src = optInteira(f.url, 1800);
    $('ver-foto').classList.add('on');
  }
  window.fecharFoto = () => { $('ver-foto').classList.remove('on'); $('ver-foto-img').src = ''; };
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    fecharFoto(); fecharMover(); if(selecionando) sairSelecao();
  });

  // ---- Copiar link da categoria ----
  window.copiarLink = async function(link){
    try{ await navigator.clipboard.writeText(link); aviso('Link copiado — é só colar no WhatsApp do cliente'); }
    catch(e){ prompt('Copie o link:', link); }
  };

  // =====================================================================
  // ---- FOTOS DE CAPA ----
  // Ficam no documento portfolio_fotos/_capas e são usadas no site de fotos,
  // na entrada deste admin, no Início do sistema de orçamentos e no PDF da proposta.
  // =====================================================================
  const SLOTS_GERAIS = [
    { k:'site',   nome:'Abertura do site de fotos',       dica:'Tela cheia quando o cliente abre o portfólio. Prefira uma foto deitada e bem iluminada.' },
    { k:'inicio', nome:'Início do sistema de orçamentos',  dica:'Faixa no topo da tela Início do sistema.' },
    { k:'padrao', nome:'Capa padrão da proposta (PDF)',    dica:'Vai no topo do PDF quando o tipo de evento não tem foto própria.' },
  ];
  // Tipos de evento do sistema de orçamentos (nome interno → nome mostrado)
  const TIPOS_PDF = [
    ['Casamento'], ['Aniversário'], ['Festa Infantil'], ['Coquetel'], ['Jantar'], ['Almoço'],
    ['Brunch'], ['Coffee Break'], ['Ilha Gastronômica'], ['Carrinho de Salgadinhos', 'Estação'],
    ['Feijoada'], ['Churrasco'], ['Menu Degustação'], ['Treinamento Corporativo'], ['Evento Corporativo'],
  ];
  let capas = {};

  // Fotos escolhidas pelo Claude em 23/10/2026 nas pastas do Drive (já guardadas no Cloudinary)
  const C = 'https://res.cloudinary.com/nhdgiswb/image/upload/';
  const SUGESTOES = {
    site:   { url: C+'v1792804321/portfolio-fotos/capas/hdgclkwsdkc5hr13a6y1.jpg', path:'portfolio-fotos/capas/hdgclkwsdkc5hr13a6y1' },
    padrao: { url: C+'v1792804322/portfolio-fotos/capas/faewgszkgg35nkerlbid.jpg', path:'portfolio-fotos/capas/faewgszkgg35nkerlbid' },
    inicio: { url: C+'v1792804323/portfolio-fotos/capas/ufrg8neqoip27nxo64pc.jpg', path:'portfolio-fotos/capas/ufrg8neqoip27nxo64pc' },
    eventos: {
      'Coffee Break': { url: C+'v1792804328/portfolio-fotos/capas/abwde9ttqspzy6xzehth.jpg', path:'portfolio-fotos/capas/abwde9ttqspzy6xzehth' },
      'Brunch':       { url: C+'v1792804330/portfolio-fotos/capas/hxnnv36x7fuvnqsnwyro.jpg', path:'portfolio-fotos/capas/hxnnv36x7fuvnqsnwyro' },
      'Coquetel':     { url: C+'v1792804332/portfolio-fotos/capas/ub6phcchljuur8mkgz7e.jpg', path:'portfolio-fotos/capas/ub6phcchljuur8mkgz7e' },
      'Feijoada':     { url: C+'v1792804333/portfolio-fotos/capas/gwsayflujfq669jrzzow.jpg', path:'portfolio-fotos/capas/gwsayflujfq669jrzzow' },
    }
  };
  function sugestoesPendentes(){
    let n = 0;
    ['site','padrao','inicio'].forEach(k => { if(!capas[k]?.url) n++; });
    Object.keys(SUGESTOES.eventos).forEach(t => { if(!capas.eventos?.[t]?.url) n++; });
    return n;
  }
  window.usarSugestoes = async function(){
    ['site','padrao','inicio'].forEach(k => { if(!capas[k]?.url) capas[k] = SUGESTOES[k]; });
    capas.eventos = capas.eventos || {};
    Object.entries(SUGESTOES.eventos).forEach(([t, f]) => { if(!capas.eventos[t]?.url) capas.eventos[t] = f; });
    renderCapas();
    await salvarCapas();
    aviso('Capas sugeridas aplicadas');
  };

  async function carregarCapas(){
    const snap = await getDoc(doc(db, 'portfolio_fotos', '_capas'));
    capas = snap.exists() ? (snap.data() || {}) : {};
    capas.eventos = capas.eventos || {};
    return capas;
  }
  async function salvarCapas(){
    salvandoCont++; estadoSalvo('salvando');
    try{
      await setDoc(doc(db, 'portfolio_fotos', '_capas'), capas);
      salvandoCont--; if(!salvandoCont) estadoSalvo('ok');
      renderNav();
    }catch(err){
      salvandoCont--; console.error(err); estadoSalvo('erro');
      aviso('Não consegui salvar a capa. Confira a internet e tente de novo.', { erro:true });
    }
  }
  function contarCapas(){
    return SLOTS_GERAIS.filter(s => capas[s.k]?.url).length + Object.values(capas.eventos || {}).filter(v => v?.url).length;
  }
  const lerSlot = chaveSlot => chaveSlot.startsWith('ev:') ? (capas.eventos || {})[chaveSlot.slice(3)] : capas[chaveSlot];
  function gravarSlot(chaveSlot, valor){
    if(chaveSlot.startsWith('ev:')){
      capas.eventos = capas.eventos || {};
      if(valor) capas.eventos[chaveSlot.slice(3)] = valor; else delete capas.eventos[chaveSlot.slice(3)];
    }else{
      if(valor) capas[chaveSlot] = valor; else delete capas[chaveSlot];
    }
  }
  function nomeSlot(chaveSlot){
    if(chaveSlot.startsWith('ev:')){ const t = TIPOS_PDF.find(x => x[0] === chaveSlot.slice(3)); return 'Proposta · ' + (t ? (t[1] || t[0]) : chaveSlot.slice(3)); }
    return (SLOTS_GERAIS.find(s => s.k === chaveSlot) || {}).nome || chaveSlot;
  }

  function slotHTML(chaveSlot, nome, dica){
    const f = lerSlot(chaveSlot);
    const herdada = !f && chaveSlot.startsWith('ev:') && capas.padrao?.url ? capas.padrao : null;
    const mostrar = f || herdada;
    return `<div class="capa-slot" data-slot="${esc(chaveSlot)}">
      <div class="previa ${herdada ? 'herda' : ''}">
        ${mostrar ? `<img src="${esc(optInteira(mostrar.url, 640))}" alt="" loading="lazy">` : `<div class="sem">${IC.foto}Sem foto</div>`}
        ${herdada ? '<span class="herdada">Usando a capa padrão</span>' : ''}
      </div>
      <div class="info">
        <div><h3>${esc(nome)}</h3>${dica ? `<p>${esc(dica)}</p>` : ''}</div>
        <div class="botoes">
          <button class="btn" onclick="abrirEscolher('${esc(chaveSlot)}')">${IC.grade}Escolher</button>
          <button class="btn" onclick="enviarCapa('${esc(chaveSlot)}')">${IC.subir}Enviar</button>
          ${f ? `<button class="btn btn-icone btn-perigo" title="Tirar esta foto" onclick="tirarCapa('${esc(chaveSlot)}')">${IC.lixo.replace('<svg', '<svg class="ic"')}</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  function renderCapas(){
    $('conteudo').innerHTML = `
      <div class="pagina-topo">
        <div>
          <h1>Fotos de capa</h1>
          <div class="sub"><span>Fotos que aparecem como "vitrine" no site, no sistema e nas propostas.</span><span id="estado-salvo" class="salvo"><span class="bolinha"></span>Tudo salvo</span></div>
        </div>
        <div class="acoes-topo">
          ${sugestoesPendentes() ? `<button class="btn btn-principal" onclick="usarSugestoes()">${IC.estrelaVaziaNav}Usar as capas sugeridas (${sugestoesPendentes()})</button>` : ''}
          <a class="btn" href="manaca-portfolio.html" target="_blank" rel="noopener">${IC.externo}<span class="texto-opcional">Ver o site do cliente</span></a>
        </div>
      </div>
      <div class="capas-secao"><h2>Site e sistema</h2></div>
      <div class="capas-grade">${SLOTS_GERAIS.map(s => slotHTML(s.k, s.nome, s.dica)).join('')}</div>
      <div class="capas-secao"><h2>Capa da proposta por tipo de evento</h2><span>Sem foto própria, o PDF usa a capa padrão. A Casinha da Deca mantém o visual próprio.</span></div>
      <div class="capas-grade">${TIPOS_PDF.map(([t, rotulo]) => slotHTML('ev:' + t, rotulo || t, '')).join('')}</div>`;
  }

  // Escolher entre as fotos que já estão no portfólio
  let slotEscolhendo = null, filtroEscolher = 'todas';
  window.abrirEscolher = function(chaveSlot){
    slotEscolhendo = chaveSlot;
    const temAlguma = categorias.some(c => (fotosPorCategoria[c.id] || []).length);
    if(!temAlguma){ aviso('Ainda não há fotos no portfólio. Use "Enviar" para mandar uma foto do computador ou celular.'); return; }
    $('escolher-titulo').textContent = nomeSlot(chaveSlot);
    filtroEscolher = 'todas';
    desenharEscolher();
    $('janela-escolher').classList.add('on');
  };
  window.fecharEscolher = () => $('janela-escolher').classList.remove('on');
  function desenharEscolher(){
    const comFotos = categorias.filter(c => (fotosPorCategoria[c.id] || []).length);
    $('escolher-filtros').innerHTML =
      `<button class="${filtroEscolher === 'todas' ? 'ativo' : ''}" data-f="todas">Todas</button>` +
      comFotos.map(c => `<button class="${filtroEscolher === c.id ? 'ativo' : ''}" data-f="${c.id}">${esc(c.nome)}</button>`).join('');
    const lista = (filtroEscolher === 'todas' ? comFotos : comFotos.filter(c => c.id === filtroEscolher))
      .flatMap(c => fotosPorCategoria[c.id]);
    $('escolher-grade').innerHTML = lista.map((f, i) =>
      `<button data-i="${i}"><img src="${esc(opt(f.url, 240))}" alt="" loading="lazy"></button>`).join('');
    $('escolher-filtros').onclick = e => { const b = e.target.closest('[data-f]'); if(b){ filtroEscolher = b.dataset.f; desenharEscolher(); } };
    $('escolher-grade').onclick = async e => {
      const b = e.target.closest('[data-i]'); if(!b) return;
      const f = lista[Number(b.dataset.i)];
      fecharEscolher();
      gravarSlot(slotEscolhendo, { url: f.url, path: f.path || '' });
      renderCapas();
      await salvarCapas();
      aviso(`Capa salva: ${nomeSlot(slotEscolhendo)}`);
    };
  }

  // Enviar uma foto nova direto para a capa
  window.enviarCapa = function(chaveSlot){
    const input = $('capa-input');
    input.value = '';
    input.onchange = async () => {
      const file = input.files[0];
      if(!file) return;
      const card = document.querySelector(`.capa-slot[data-slot="${CSS.escape(chaveSlot)}"]`);
      card?.classList.add('enviando');
      try{
        const arquivo = await prepararArquivo(file);
        const data = await enviarUm(arquivo, () => {}, 'portfolio-fotos/capas');
        gravarSlot(chaveSlot, { url: data.secure_url, path: data.public_id });
        renderCapas();
        await salvarCapas();
        aviso(`Capa salva: ${nomeSlot(chaveSlot)}`);
      }catch(err){
        console.error(err);
        card?.classList.remove('enviando');
        aviso('Não consegui enviar a foto. Tente de novo.', { erro:true });
      }
    };
    input.click();
  };

  window.tirarCapa = async function(chaveSlot){
    const antes = lerSlot(chaveSlot);
    gravarSlot(chaveSlot, null);
    renderCapas();
    await salvarCapas();
    aviso('Capa retirada', { desfazer: async () => { gravarSlot(chaveSlot, antes); if(categoriaAtual === 'capas') renderCapas(); await salvarCapas(); } });
  };

  // ---- Envio de fotos ----
  function ligarEnvio(){
    const dz = $('dropzone'), input = $('file-input');
    input.addEventListener('change', e => { adicionarFotos(e.target.files); input.value = ''; });
    dz.addEventListener('dragover', e => { if(e.dataTransfer.types.includes('Files')){ e.preventDefault(); dz.classList.add('arrastando'); } });
    dz.addEventListener('dragleave', () => dz.classList.remove('arrastando'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('arrastando'); adicionarFotos(e.dataTransfer.files); });
  }

  // Diminui fotos muito grandes antes de enviar (fica mais rápido e não estoura o limite do Cloudinary)
  async function prepararArquivo(file){
    const LADO_MAX = 2560;
    try{
      if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const escala = Math.min(1, LADO_MAX / Math.max(bmp.width, bmp.height));
      if(escala === 1 && file.size < 4_000_000){ bmp.close?.(); return file; }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * escala);
      canvas.height = Math.round(bmp.height * escala);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close?.();
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
      return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type:'image/jpeg' }) : file;
    }catch(e){ return file; }   // se o navegador não conseguir ler (ex.: HEIC), manda o original
  }

  function enviarUm(arquivo, aoProgredir, pasta){
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('file', arquivo);
      fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      fd.append('folder', pasta || `portfolio-fotos/${categoriaAtual}`);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', CLOUDINARY_UPLOAD_URL);
      xhr.upload.onprogress = e => { if(e.lengthComputable) aoProgredir(e.loaded / e.total); };
      xhr.onload = () => {
        let data = {};
        try{ data = JSON.parse(xhr.responseText); }catch(e){}
        if(xhr.status >= 200 && xhr.status < 300 && data.secure_url) resolve(data);
        else reject(new Error(data.error?.message || 'Falha no envio'));
      };
      xhr.onerror = () => reject(new Error('Sem conexão'));
      xhr.send(fd);
    });
  }

  let enviando = false;
  async function adicionarFotos(fileList){
    const arquivos = Array.from(fileList).filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    if(!arquivos.length){ aviso('Escolha arquivos de imagem (JPG, PNG…)', { erro:true }); return; }
    if(enviando){ aviso('Espere terminar o envio atual'); return; }
    enviando = true;
    const id = categoriaAtual;
    const fila = $('fila'), itens = $('fila-itens');
    fila.classList.add('on');
    itens.innerHTML = arquivos.map((f, k) => `<div class="fila-item" id="fi-${k}"><img alt=""><div class="prog"></div><div class="marca">${IC.check}</div></div>`).join('');
    arquivos.forEach((f, k) => { const u = URL.createObjectURL(f); const im = itens.querySelector(`#fi-${k} img`); im.src = u; im.onload = () => URL.revokeObjectURL(u); });

    const progresso = new Array(arquivos.length).fill(0);
    const resultados = new Array(arquivos.length).fill(null);
    let prontas = 0, erros = 0;
    const atualizar = () => {
      const media = progresso.reduce((a, b) => a + b, 0) / arquivos.length;
      $('fila-barra').style.width = (media * 100) + '%';
      $('fila-texto').textContent = `${prontas + erros} de ${arquivos.length}`;
    };
    atualizar();

    // Envia 3 de cada vez
    let proximo = 0;
    async function trabalhador(){
      while(proximo < arquivos.length){
        const k = proximo++;
        const el = itens.querySelector(`#fi-${k}`);
        try{
          const arquivo = await prepararArquivo(arquivos[k]);
          const data = await enviarUm(arquivo, p => { progresso[k] = p * 0.98; el.querySelector('.prog').style.width = (p * 100) + '%'; atualizar(); });
          resultados[k] = { url: data.secure_url, path: data.public_id, capa: false };
          progresso[k] = 1; prontas++;
          el.classList.add('pronto');
        }catch(err){
          console.error('Erro ao enviar', arquivos[k].name, err);
          progresso[k] = 1; erros++;
          el.classList.add('erro');
          el.title = `${arquivos[k].name}: ${err.message}`;
        }
        atualizar();
      }
    }
    await Promise.all([trabalhador(), trabalhador(), trabalhador()]);

    // Junta com a lista mais nova do servidor (caso alguém tenha mexido enquanto isso)
    try{ await carregarFotos(id); }catch(e){}
    const lista = fotosPorCategoria[id];
    const novas = resultados.filter(Boolean);
    if(!lista.some(f => f.capa) && novas[0]) novas[0].capa = true;
    lista.push(...novas);
    if(categoriaAtual === id) renderFotos();
    if(novas.length) await salvarFotos(id);
    enviando = false;

    if(erros) aviso(`${plural(erros, 'foto não foi enviada', 'fotos não foram enviadas')}. Tente essas de novo.`, { erro:true });
    if(novas.length) aviso(`${plural(novas.length, 'foto adicionada', 'fotos adicionadas')} em ${nomeCat(id)}`);
    setTimeout(() => { if(!enviando) fila.classList.remove('on'); }, erros ? 8000 : 2200);
  }

  // Avisar antes de fechar a aba no meio de um envio
  window.addEventListener('beforeunload', e => { if(enviando){ e.preventDefault(); e.returnValue = ''; } });
</script>
